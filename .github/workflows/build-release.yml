name: Build and release JKSV Cloud

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/^APP_VERSION[[:space:]]*:=[[:space:]]*//p' Makefile | tr -d '[:space:]')"
          test "$tag_version" = "$app_version"

      - name: Build NRO
        run: make -j1

      - name: Create SD package
        shell: bash
        run: |
          version="$(sed -n 's/^APP_VERSION[[:space:]]*:=[[:space:]]*//p' Makefile | tr -d '[:space:]')"
          mkdir -p release/switch/JKSV-Cloud
          cp JKSV-Cloud.nro release/switch/JKSV-Cloud/boot.nro
          cd release
          python3 -m zipfile -c "../JKSV-Cloud-${version}.zip" switch/JKSV-Cloud/boot.nro

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JKSV-Cloud-${{ github.sha }}
          path: |
            JKSV-Cloud.nro
            JKSV-Cloud-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: JKSV-Cloud-${{ github.sha }}
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/JKSV-Cloud.nro \
            release-assets/JKSV-Cloud-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "JKSV Cloud ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
