name: Build and release JKSV Cloud

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Trust checked out repository for container Git commands
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/^APP_VERSION[[:space:]]*:=[[:space:]]*//p' Makefile | tr -d '[:space:]')"
          test "$tag_version" = "$app_version"

      - name: Validate component versions
        shell: bash
        run: |
          app_version="$(sed -n 's/^APP_VERSION[[:space:]]*:=[[:space:]]*//p' Makefile | tr -d '[:space:]')"
          grep -Fq "VERSION = \"$app_version\"" sysmodule/include/Config.hpp
          python3 - "$app_version" <<'PY'
          import json
          import sys

          with open("sysmodule/toolbox.json", encoding="utf-8") as stream:
              toolbox = json.load(stream)
          if toolbox.get("version") != sys.argv[1]:
              raise SystemExit("toolbox.json version does not match APP_VERSION")
          PY
          grep -Fq "JKSV-Cloud-Sync/$app_version" sysmodule/source/MbedWebDav.cpp

      - name: Build NRO and sync sysmodule
        run: make -j1

      - name: Create SD package
        shell: bash
        run: |
          version="$(sed -n 's/^APP_VERSION[[:space:]]*:=[[:space:]]*//p' Makefile | tr -d '[:space:]')"
          mkdir -p release-staging/switch/JKSV-Cloud
          mkdir -p release-staging/atmosphere/contents/420000000000C10D/flags
          mkdir -p release-assets
          cp JKSV-Cloud.nro release-assets/JKSV-Cloud.nro
          cp sysmodule/JKSV-Cloud-Sync.nsp release-assets/JKSV-Cloud-Sync.nsp
          cp JKSV-Cloud.nro release-staging/switch/JKSV-Cloud/boot.nro
          cp sysmodule/JKSV-Cloud-Sync.nsp release-staging/atmosphere/contents/420000000000C10D/exefs.nsp
          cp romfs/certs/cacert.pem release-staging/atmosphere/contents/420000000000C10D/cacert.pem
          cp sysmodule/toolbox.json release-staging/atmosphere/contents/420000000000C10D/toolbox.json
          touch release-staging/atmosphere/contents/420000000000C10D/flags/boot2.flag
          VERSION="$version" python3 - <<'PY'
          import os
          import subprocess
          from zipfile import ZIP_DEFLATED, ZipFile

          common = [
              "switch/JKSV-Cloud/boot.nro",
              "atmosphere/contents/420000000000C10D/exefs.nsp",
              "atmosphere/contents/420000000000C10D/cacert.pem",
              "atmosphere/contents/420000000000C10D/toolbox.json",
          ]
          version = os.environ["VERSION"]
          for suffix, files in (
              ("", common + ["atmosphere/contents/420000000000C10D/flags/boot2.flag"]),
              ("-safe", common),
          ):
              output = f"release-assets/JKSV-Cloud-{version}{suffix}.zip"
              with ZipFile(output, "w", ZIP_DEFLATED) as archive:
                  for path in files:
                      archive.write(f"release-staging/{path}", path)

          source_name = f"JKSV-Cloud-{version}-source"
          tracked = subprocess.check_output(
              ["git", "ls-files", "--recurse-submodules", "-z"]
          ).decode().split("\0")
          with ZipFile(f"release-assets/{source_name}.zip", "w", ZIP_DEFLATED) as archive:
              for path in tracked:
                  if path and os.path.isfile(path):
                      archive.write(path, f"{source_name}/{path}")
          PY

      - name: Create checksums
        shell: bash
        run: |
          version="$(sed -n 's/^APP_VERSION[[:space:]]*:=[[:space:]]*//p' Makefile | tr -d '[:space:]')"
          cd release-assets
          sha256sum \
            JKSV-Cloud.nro \
            JKSV-Cloud-Sync.nsp \
            "JKSV-Cloud-$version.zip" \
            "JKSV-Cloud-$version-safe.zip" \
            "JKSV-Cloud-$version-source.zip" \
            > "SHA256SUMS-$version.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JKSV-Cloud-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: JKSV-Cloud-${{ github.sha }}
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/JKSV-Cloud.nro \
            release-assets/JKSV-Cloud-Sync.nsp \
            release-assets/JKSV-Cloud-*.zip \
            release-assets/SHA256SUMS-*.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "JKSV Cloud ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
